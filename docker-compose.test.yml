# Test environment: a throwaway Postgres and a container with pytest, completely separate from the real stack.
#
#   docker compose -f docker-compose.test.yml run --rm tests sh -c "cd api && python -m pytest -q"
#
# It has its own project name, its own database (in memory, gone when it stops) and no published ports, so it cannot touch
# your real words, accounts or the Langflow tools' database role. The API tests DROP the `tutor` schema and reset the
# `tutor_tools` role: never point them at the real database, which is why they run here. scripts/run_all_checks.py uses this.
name: tutor-tests

services:
  test-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=testpw
      - POSTGRES_DB=langflow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: api/Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
    working_dir: /app
    environment:
      - TEST_DATABASE_URL=postgresql://langflow:testpw@test-db:5432/langflow
      - ADMIN_DATABASE_URL=postgresql://langflow:testpw@test-db:5432/langflow
      - DATABASE_URL=postgresql://langflow:testpw@test-db:5432/langflow
      - PYTHONPATH=/app/tutor_core:/app/scripts:/app/custom_components
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - .:/app
