[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor_core"
version = "0.1.0"
description = "Shared, framework-free logic for the language tutor (used by Langflow and the web API)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# tutor_core.db and tutor_core.vocab talk to Postgres. Not a hard dependency: the Langflow image and the API image
# both already provide psycopg2, and the pure modules (languages, words, prompts, groq) need nothing at all.
db = ["psycopg2-binary"]
# Tier-1 lemma matching for the quality report (added in a later milestone)
lemmas = ["simplemma"]
cjk = ["rjieba", "janome", "kiwipiepy"]
# Readings for Chinese (pinyin), Japanese (romaji) and Korean (romanization), computed here instead of by the model
pronounce = ["pypinyin", "pykakasi", "korean-romanizer"]

[tool.setuptools.packages.find]
include = ["tutor_core*"]

[tool.setuptools.package-data]
tutor_core = ["data/*.txt", "data/*.json"]
