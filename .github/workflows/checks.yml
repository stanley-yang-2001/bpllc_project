# The unit checks on every push and pull request: the same runner you use locally (scripts/run_all_checks.py), against a
# throwaway Postgres. It never starts the stack or calls Groq, so it needs no secrets. Live and browser checks stay on your machine
# (run-checks.bat --stack / --live / --round).
name: checks
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: langflow
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: langflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U langflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://langflow:testpw@localhost:5432/langflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python packages (the same set as api/Dockerfile.test)
        run: pip install -r api/requirements-dev.txt simplemma rjieba janome kiwipiepy pypinyin pykakasi korean-romanizer
      - name: Unit checks
        run: python scripts/run_all_checks.py --native
      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/
