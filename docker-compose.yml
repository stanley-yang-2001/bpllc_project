services:
  langflow:
    build:
      context: ./tutor_core        # only the package is sent to the builder
      dockerfile: ../langflow/Dockerfile
      args:
        RUN_AS_USER: ${LANGFLOW_RUN_AS_USER:-user}
    image: language-tutor-langflow:1.12.2   # the base is langflowai/langflow:1.12.2 (pinned in langflow/Dockerfile); 1.12.2 runs Python 3.14.7
    ports:
      - "127.0.0.1:7860:7860"   # localhost only: the tools trust the learner id they are given (design section 3)
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:${POSTGRES_PASSWORD:-langflow}@postgres:5432/langflow
      - LANGFLOW_COMPONENTS_PATH=/app/custom_components:/app/shared_components
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD:-admin123}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LANGFLOW_LOAD_FLOWS_PATH=/app/flows   # M0: flows in ./flows load at startup (verify in M0)
      # M3: what the tools (tutor_core) read. No credentials, hosts or model names are written in the code.
      - DATABASE_URL=postgresql://langflow:${POSTGRES_PASSWORD:-langflow}@postgres:5432/langflow
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - MAX_PROMPT_WORDS=${MAX_PROMPT_WORDS:-150}
      # DEVELOPMENT ONLY: a request that sends NO learner id acts as this learner (the Playground, one-off scripts).
      # Leave it empty in anything that is not your own machine; with it empty, a request without a learner is refused.
      - TUTOR_DEV_USER_ID=${TUTOR_DEV_USER_ID:-}
      - TUTOR_DEV_LANGUAGE=${TUTOR_DEV_LANGUAGE:-en}
    volumes:
      - ./flows:/app/flows
      - ./custom_components:/app/custom_components
      - ../shared-components/universal-model-selector:/app/shared_components
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      api:                       # the api runs the migrations that create the `tutor` schema the tools read
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-langflow}
      - POSTGRES_DB=langflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .                  # repo root, so tutor_core can be copied in
      dockerfile: api/Dockerfile
    expose:
      - "8000"                    # reachable by nginx only, not published to the host
    environment:
      - DATABASE_URL=postgresql://langflow:${POSTGRES_PASSWORD:-langflow}@postgres:5432/langflow
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_MODE=${AI_MODE:-live}
      - MAX_PROMPT_WORDS=${MAX_PROMPT_WORDS:-150}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - DEMO_EMAIL=${DEMO_EMAIL:-demo@example.com}
      - PRIVACY_CONTACT=${PRIVACY_CONTACT:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      # Chat (M5). Live chat stays OFF until LANGFLOW_PER_USER_TOOLS=1: the flow's tools must read the learner's own
      # words first (milestones M0 and M3). AI_MODE=stub needs none of these.
      - LANGFLOW_URL=http://langflow:7860
      - LANGFLOW_FLOW=${LANGFLOW_FLOW:-language-tutor}
      - LANGFLOW_API_KEY=${LANGFLOW_API_KEY:-}
      - LANGFLOW_TWEAK_KEYS=${LANGFLOW_TWEAK_KEYS-AddWord-WhP5g,StoryGeneratorTool-RQpvc}
      - LANGFLOW_PER_USER_TOOLS=${LANGFLOW_PER_USER_TOOLS:-0}
      - AI_GATE_SLOTS=${AI_GATE_SLOTS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
