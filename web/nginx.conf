server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api is forwarded unchanged (FastAPI serves everything under /api itself): no rewrite rule to get wrong.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # above the 60 s AI deadline; nginx's 60 s default would cut slow stories
        client_max_body_size 2m;      # CSV uploads are capped at 1 MB by the API
    }

    # hashed build files: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;   # add_header in a location replaces inherited ones, so repeat
    }

    # the page shell must always be re-checked so a new deployment is picked up
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # client-side routes (/vocabulary, /login, ...) fall back to the app
    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
